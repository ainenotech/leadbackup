services:
  backend:
    build: .
    container_name: lead_backend
    command: python -m uvicorn Backend.api:app --host 0.0.0.0 --port 8000
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
    ports:
      - "8000:8000"

  frontend:
    build: .
    container_name: lead_frontend
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.enableCORS false --server.enableXsrfProtection false
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
    ports:
      - "8501:8501"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: lead_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
